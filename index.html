<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electron Alarm</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; }
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            background: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Alarm Kur</h1>
    <input type="number" id="hour" min="0" max="23" placeholder="Saat">
    <input type="number" id="minute" min="0" max="59" placeholder="Dakika">
    <button onclick="setAlarm()">Alarm Kur</button>
    <button onclick="hideApp()">Gizle</button>

    <div id="alarmModal" class="modal">
        <p>Alarm Çaldı!</p>
        <button onclick="closeAlarm()">Evet</button>
        <button onclick="snoozeAlarm()">Ertele (5dk)</button>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
